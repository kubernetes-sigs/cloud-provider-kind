# Create the CA ConfigMap first. The backend must serve TLS for the hostname
# in BackendTLSPolicy.spec.validation.hostname:
#   kubectl create configmap backend-ca --from-file=ca.crt=ca.crt
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: prod-web
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - protocol: HTTP
    port: 80
    name: prod-web-gw
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: foo
spec:
  parentRefs:
  - name: prod-web
  rules:
  - backendRefs:
    - name: myapp-svc
      port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: myapp-backend-tls
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: myapp-svc
  validation:
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: backend-ca
    hostname: myapp-svc.example.com
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-svc
spec:
  type: ClusterIP
  selector:
    app: MyApp
  ports:
    - name: https
      port: 8443
      targetPort: 443
